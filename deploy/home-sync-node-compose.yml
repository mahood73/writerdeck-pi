services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: writerdeck-syncthing
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./syncthing-config:/config
      - ./writerdeck-data:/data/writing
